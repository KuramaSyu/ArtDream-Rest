basePath: /api/v1
definitions:
  store.ImageModeration:
    properties:
      deranked:
        type: boolean
      hidden:
        type: boolean
      imageId:
        type: string
      note:
        type: string
      timeWindow:
        type: string
      updatedAt:
        type: string
      updatedBy:
        type: integer
    type: object
  store.User:
    properties:
      createdAt:
        type: string
      createdBy:
        type: integer
      displayName:
        type: string
      id:
        type: integer
      isAdmin:
        type: boolean
      username:
        type: string
    type: object
  store.VoteMode:
    properties:
      createdAt:
        type: string
      description:
        type: string
      id:
        type: integer
      isBinary:
        type: boolean
      maxValue:
        type: integer
      minValue:
        type: integer
      name:
        type: string
    type: object
  web.AdminVoteListResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/web.VoteDTO'
        type: array
      time:
        type: string
      total:
        type: integer
    type: object
  web.AuthorImageListResponse:
    properties:
      author:
        type: string
      items:
        items:
          $ref: '#/definitions/web.imageDTO'
        type: array
      total:
        type: integer
    type: object
  web.ClaimResponse:
    properties:
      claimed:
        items:
          type: string
        type: array
      count:
        type: integer
    type: object
  web.DeleteCountResponse:
    properties:
      deleted:
        type: integer
    type: object
  web.DeleteImageResponse:
    properties:
      deleted:
        type: string
    type: object
  web.DeleteUserResponse:
    properties:
      deleted:
        type: integer
    type: object
  web.DeleteVoteResponse:
    properties:
      deleted:
        type: integer
    type: object
  web.DeletedCountResponse:
    properties:
      deleted:
        type: integer
    type: object
  web.FrontendConfigResponse:
    properties:
      defaultImageVisibility:
        example: all
        type: string
      rankRotationEnabled:
        type: boolean
      rankRotationPercent:
        example: 60
        type: integer
      rankingAnonymized:
        type: boolean
      updatedAt:
        type: string
    type: object
  web.HealthResponse:
    properties:
      status:
        example: ok
        type: string
      time:
        type: string
    type: object
  web.ImageListResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/web.imageDTO'
        type: array
      total:
        type: integer
    type: object
  web.ModerationDeleteResponse:
    properties:
      deleted:
        type: string
      timeWindow:
        type: string
    type: object
  web.NeedsBootstrapResponse:
    properties:
      needsBootstrap:
        type: boolean
      userCount:
        type: integer
    type: object
  web.OKResponse:
    properties:
      ok:
        example: true
        type: boolean
    type: object
  web.UserResponse:
    properties:
      user:
        $ref: '#/definitions/store.User'
    type: object
  web.UsersResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/store.User'
        type: array
      total:
        type: integer
    type: object
  web.VoteDTO:
    properties:
      createdAt:
        type: string
      durationMs:
        type: integer
      id:
        type: integer
      leftImage:
        $ref: '#/definitions/web.imageDTO'
      leftImageId:
        type: string
      loserImage:
        $ref: '#/definitions/web.imageDTO'
      loserImageId:
        type: string
      maxValue:
        type: integer
      metadata:
        additionalProperties: {}
        type: object
      minValue:
        type: integer
      modeId:
        type: integer
      modeName:
        type: string
      rightImage:
        $ref: '#/definitions/web.imageDTO'
      rightImageId:
        type: string
      user:
        $ref: '#/definitions/web.voteUserDTO'
      userId:
        type: integer
      username:
        type: string
      value:
        type: integer
      weight:
        type: number
      winner:
        example: left
        type: string
      winnerImage:
        $ref: '#/definitions/web.imageDTO'
      winnerImageId:
        type: string
    type: object
  web.VotePayload:
    properties:
      anonymousId:
        description: AnonymousID is the device-local secret used when no account is
          signed in.
        example: 6f1c...
        type: string
      durationMs:
        example: 1234
        type: integer
      leftImageId:
        example: 4a1f2c9d8e7b6a5c4d3e2f10
        type: string
      maxValue:
        example: 5
        type: integer
      metadata:
        additionalProperties: {}
        type: object
      minValue:
        example: 1
        type: integer
      mode:
        example: duel
        type: string
      modeId:
        example: 1
        type: integer
      rightImageId:
        example: 9b8a7c6d5e4f3a2b1c0d9e8f
        type: string
      value:
        example: 2
        type: number
      winner:
        example: left
        type: string
    type: object
  web.adminRankEntry:
    properties:
      author:
        type: string
      deranked:
        type: boolean
      excluded:
        type: boolean
      height:
        type: integer
      hidden:
        type: boolean
      id:
        type: string
      image:
        $ref: '#/definitions/web.imageDTO'
      losses:
        type: integer
      moderationWindow:
        type: string
      note:
        type: string
      override:
        type: boolean
      rank:
        type: integer
      score:
        type: number
      scoreRank:
        type: integer
      ties:
        type: integer
      title:
        type: string
      url:
        type: string
      votes:
        type: integer
      width:
        type: integer
      winPercentage:
        type: number
      winRate:
        type: number
      wins:
        type: integer
    type: object
  web.adminRankResponse:
    properties:
      amount:
        type: integer
      derankedCount:
        type: integer
      excludedCount:
        type: integer
      from:
        type: string
      hiddenCount:
        type: integer
      offset:
        type: integer
      strategy:
        description: Strategy is the aggregation strategy that produced the scores.
        type: string
      time:
        type: string
      to:
        type: string
      total:
        type: integer
      totalVotes:
        type: integer
      window:
        type: string
      winners:
        items:
          $ref: '#/definitions/web.adminRankEntry'
        type: array
    type: object
  web.apiError:
    properties:
      error:
        $ref: '#/definitions/web.errBody'
    type: object
  web.claimItem:
    properties:
      claimToken:
        type: string
      id:
        type: string
      imageId:
        type: string
      token:
        type: string
    type: object
  web.claimRequest:
    properties:
      claimToken:
        type: string
      claims:
        items:
          $ref: '#/definitions/web.claimItem'
        type: array
      id:
        type: string
      imageId:
        type: string
      token:
        type: string
    type: object
  web.createUserRequest:
    properties:
      displayName:
        type: string
      isAdmin:
        type: boolean
      password:
        type: string
      username:
        type: string
    type: object
  web.errBody:
    properties:
      code:
        type: string
      message:
        type: string
    type: object
  web.frontendConfigRequest:
    properties:
      defaultImageVisibility:
        type: string
      rankRotationEnabled:
        type: boolean
      rankRotationPercent:
        type: integer
      rankingAnonymized:
        type: boolean
    type: object
  web.imageDTO:
    properties:
      author:
        type: string
      createdAt:
        type: string
      deletedAt:
        type: string
      fromPublicService:
        type: boolean
      height:
        type: integer
      id:
        type: string
      mimeType:
        type: string
      originalFilename:
        type: string
      serviceName:
        type: string
      sizeBytes:
        type: integer
      title:
        type: string
      uploadedBy:
        type: integer
      url:
        type: string
      visibility:
        type: string
      width:
        type: integer
    type: object
  web.loginRequest:
    properties:
      password:
        type: string
      username:
        type: string
    type: object
  web.moderationRequest:
    properties:
      deranked:
        type: boolean
      hidden:
        type: boolean
      note:
        type: string
      timeWindow:
        type: string
    type: object
  web.rankEntry:
    properties:
      author:
        type: string
      boost:
        description: |-
          Boost is the exploration weight applied to the ordering key. It is
          omitted for entries that were not reweighted.
        type: number
      explore:
        description: |-
          Explore marks an unrated image that exploration mixed into the ranking
          because it is new and has no votes in the requested window.
        type: boolean
      height:
        type: integer
      id:
        type: string
      image:
        $ref: '#/definitions/web.imageDTO'
      losses:
        type: integer
      random:
        description: Random marks an image selected by the smart endpoint's random
          fallback.
        type: boolean
      rank:
        type: integer
      rotated:
        description: Rotated marks a deterministic fallback image added by rank rotation.
        type: boolean
      score:
        type: number
      ties:
        type: integer
      title:
        type: string
      url:
        type: string
      votes:
        type: integer
      width:
        type: integer
      winPercentage:
        type: number
      winRate:
        type: number
      wins:
        type: integer
    type: object
  web.rankFiltersDTO:
    properties:
      excludeAuthors:
        items:
          type: string
        type: array
      excludeTitles:
        items:
          type: string
        type: array
      includeAuthors:
        items:
          type: string
        type: array
      includeTitles:
        items:
          type: string
        type: array
    type: object
  web.rankFiltersRequest:
    properties:
      excludeAuthors:
        items:
          type: string
        type: array
      excludeTitles:
        items:
          type: string
        type: array
      includeAuthors:
        items:
          type: string
        type: array
      includeTitles:
        items:
          type: string
        type: array
    type: object
  web.rankResponse:
    properties:
      amount:
        type: integer
      explore:
        description: Explore reports whether new, under-voted images were weighted.
        type: boolean
      from:
        type: string
      offset:
        type: integer
      rotation:
        $ref: '#/definitions/web.rankRotationInfo'
      source:
        description: 'Source is set by the smart endpoint: day, week, month, year
          or random.'
        type: string
      strategy:
        description: |-
          Strategy is the aggregation strategy that produced the scores.
          AHP (default) returns normalized priority weights summing to 1.
        type: string
      time:
        type: string
      to:
        type: string
      total:
        type: integer
      totalVotes:
        type: integer
      winners:
        items:
          $ref: '#/definitions/web.rankEntry'
        type: array
    type: object
  web.rankRotationInfo:
    properties:
      changed:
        type: integer
      enabled:
        type: boolean
      percent:
        type: integer
      previousFrom:
        type: string
      previousTo:
        type: string
      required:
        type: integer
      satisfied:
        type: boolean
    type: object
  web.sessionResponse:
    properties:
      token:
        type: string
      user:
        $ref: '#/definitions/store.User'
    type: object
  web.updateImageRequest:
    properties:
      author:
        type: string
      fromPublicService:
        type: boolean
      serviceName:
        type: string
      title:
        type: string
    type: object
  web.updateMeRequest:
    properties:
      currentPassword:
        type: string
      displayName:
        type: string
      password:
        type: string
    type: object
  web.updateUserRequest:
    properties:
      displayName:
        type: string
      isAdmin:
        type: boolean
      password:
        type: string
    type: object
  web.uploadResponse:
    properties:
      claimToken:
        type: string
      image:
        $ref: '#/definitions/web.imageDTO'
    type: object
  web.voteClaimRequest:
    properties:
      anonymousId:
        type: string
      anonymousIds:
        items:
          type: string
        type: array
      token:
        type: string
      tokens:
        items:
          type: string
        type: array
      voterId:
        type: string
      voterIds:
        items:
          type: string
        type: array
    type: object
  web.voteModeRequest:
    properties:
      description:
        type: string
      isBinary:
        type: boolean
      maxValue:
        type: integer
      minValue:
        type: integer
      name:
        type: string
    type: object
  web.voteUserDTO:
    properties:
      displayName:
        type: string
      id:
        type: integer
      username:
        type: string
    type: object
info:
  contact: {}
  description: |-
    REST API for uploading, browsing, voting on and ranking ArtDream artwork.
    Authentication uses the session token returned by POST /auth/login. Send it as `Authorization: Bearer <token>`.
  title: ArtDream API
  version: "1.0"
paths:
  /admin/frontend-config:
    patch:
      consumes:
      - application/json
      description: Updates the ranking anonymization switch and/or the default image
        visibility.
      parameters:
      - description: Config fields to update
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/web.frontendConfigRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/web.FrontendConfigResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/web.apiError'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/web.apiError'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/web.apiError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/web.apiError'
      security:
      - BearerAuth: []
      summary: Update frontend configuration
      tags:
      - config
  /admin/images:
    delete:
      description: Deletes the images named by ids, or every image matching the shared
        admin filters when ids is omitted.
      parameters:
      - collectionFormat: csv
        description: Explicit image IDs; takes precedence over the filters
        in: query
        items:
          type: string
        name: ids
        type: array
      - description: Keep votes that reference the deleted images
        in: query
        name: keepVotes
        type: boolean
      - description: Author substring filter
        in: query
        name: author
        type: string
      - description: Title regex filter
        in: query
        name: titleRegex
        type: string
      - description: Visibility filter
        enum:
        - all
        - public
        - private
        in: query
        name: visibility
        type: string
      - description: Public service name filter
        in: query
        name: service
        type: string
      - collectionFormat: csv
        description: Uploader IDs or usernames (comma separated, 'me' allowed)
        in: query
        items:
          type: string
        name: uploadedBy
        type: array
      - description: Only images uploaded by the signed-in user
        in: query
        name: mine
        type: boolean
      - description: Include soft-deleted images
        in: query
        name: includeDeleted
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/web.DeletedCountResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/web.apiError'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/web.apiError'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/web.apiError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/web.apiError'
      security:
      - BearerAuth: []
      summary: Bulk delete images (admin)
      tags:
      - images
    get:
      description: Lists images including private and optionally deleted entries,
        using the shared admin filters.
      parameters:
      - description: Page size (default 50, max 500)
        in: query
        name: amount
        type: integer
      - description: Pagination offset
        in: query
        name: offset
        type: integer
      - description: Author substring filter
        in: query
        name: author
        type: string
      - description: Alias for author
        in: query
        name: authorName
        type: string
      - description: Title regex filter
        in: query
        name: titleRegex
        type: string
      - description: Visibility filter
        enum:
        - all
        - public
        - private
        in: query
        name: visibility
        type: string
      - description: Public service name filter
        in: query
        name: service
        type: string
      - collectionFormat: csv
        description: Uploader IDs or usernames (comma separated, 'me' allowed)
        in: query
        items:
          type: string
        name: uploadedBy
        type: array
      - description: Only images uploaded by the signed-in user
        in: query
        name: mine
        type: boolean
      - description: Include soft-deleted images
        in: query
        name: includeDeleted
        type: boolean
      - description: Time window (accepted for symmetry with the vote filters)
        enum:
        - day
        - week
        - month
        - year
        - all
        - custom
        in: query
        name: time
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/web.ImageListResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/web.apiError'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/web.apiError'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/web.apiError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/web.apiError'
      security:
      - BearerAuth: []
      summary: List images (admin)
      tags:
      - images
  /admin/images/{id}:
    delete:
      description: Deletes the image, its cache variants and (unless keepVotes=true)
        its votes.
      parameters:
      - description: Image ID
        in: path
        name: id
        required: true
        type: string
      - description: Keep the votes that reference this image
        in: query
        name: keepVotes
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/web.DeleteImageResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/web.apiError'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/web.apiError'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/web.apiError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/web.apiError'
      security:
      - BearerAuth: []
      summary: Delete an image (admin)
      tags:
      - images
    patch:
      consumes:
      - application/json
      description: Updates author, title and public-service provenance. Setting fromPublicService=false
        clears serviceName.
      parameters:
      - description: Image ID
        in: path
        name: id
        required: true
        type: string
      - description: Fields to update
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/web.updateImageRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/web.imageDTO'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/web.apiError'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/web.apiError'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/web.apiError'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/web.apiError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/web.apiError'
      security:
      - BearerAuth: []
      summary: Update image metadata (admin)
      tags:
      - images
  /admin/images/{id}/moderation:
    delete:
      parameters:
      - description: Image ID
        in: path
        name: id
        required: true
        type: string
      - description: Ranking period (default all)
        enum:
        - all
        - day
        - week
        - month
        - year
        in: query
        name: timeWindow
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/web.ModerationDeleteResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/web.apiError'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/web.apiError'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/web.apiError'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/web.apiError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/web.apiError'
      security:
      - BearerAuth: []
      summary: Clear image moderation for a period (admin)
      tags:
      - admin
    patch:
      consumes:
      - application/json
      description: Hides and/or deranks an image for one ranking window without deleting
        it.
      parameters:
      - description: Image ID
        in: path
        name: id
        required: true
        type: string
      - description: Moderation decision
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/web.moderationRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/store.ImageModeration'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/web.apiError'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/web.apiError'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/web.apiError'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/web.apiError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/web.apiError'
      security:
      - BearerAuth: []
      summary: Set image moderation for a period (admin)
      tags:
      - admin
  /admin/rank:
    get:
      description: Returns exact per-image numbers for any period, including hidden
        and deranked images flagged in the response. The default AHP strategy returns
        normalized priority weights (score, sum 1).
      parameters:
      - description: Time window
        enum:
        - day
        - week
        - month
        - year
        - all
        - custom
        in: query
        name: time
        type: string
      - description: Custom window size in seconds (when time=custom)
        in: query
        name: seconds
        type: integer
      - description: Custom range start (RFC3339 or unix seconds)
        in: query
        name: from
        type: string
      - description: Custom range end (RFC3339 or unix seconds)
        in: query
        name: to
        type: string
      - description: Page size (default 100, max 500)
        in: query
        name: amount
        type: integer
      - description: Pagination offset
        in: query
        name: offset
        type: integer
      - description: Ranking strategy (default ahp)
        enum:
        - ahp
        - legacy
        in: query
        name: strategy
        type: string
      - description: Alias for strategy
        in: query
        name: rankingStrategy
        type: string
      - description: Vote mode name filter
        in: query
        name: mode
        type: string
      - description: Author substring filter
        in: query
        name: author
        type: string
      - description: Title regex filter
        in: query
        name: titleRegex
        type: string
      - description: Include hidden images in the result (default true)
        in: query
        name: includeHidden
        type: boolean
      produces:
      - application/json
      responses:
        "200":
