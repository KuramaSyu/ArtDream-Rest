services:
  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      ADDR: ":8080"
      DATA_DIR: /data
      GIN_MODE: release
      ALLOWED_ORIGINS: "http://localhost:5173,http://localhost:8082,http://localhost:8080,https://artdream.inu-the-bot.com"
      IMAGE_RENDER_CONCURRENCY: "${IMAGE_RENDER_CONCURRENCY:-2}"
    volumes:
      - artdream-data:/data
    ports:
      - "${BACKEND_PORT:-8091}:8080"
    labels:
      com.centurylinklabs.watchtower.enable: "false"
      traefik.enable: "true"
      traefik.http.routers.artdream-api.entrypoints: websecure
      traefik.http.routers.artdream-api.rule: Host(`artdream-api.inu-the-bot.com`)
      traefik.http.services.artdream-api.loadbalancer.server.port: "8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/api/v1/health"]
      interval: 10s
      timeout: 3s
      retries: 5

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-8092}:80"
    labels:
      com.centurylinklabs.watchtower.enable: "false"
      traefik.enable: "true"
      traefik.http.routers.artdream.entrypoints: websecure
      traefik.http.routers.artdream.rule: Host(`artdream.inu-the-bot.com`)
      traefik.http.services.artdream.loadbalancer.server.port: "80"

volumes:
  artdream-data:
